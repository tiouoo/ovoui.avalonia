name: publish/nuget

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate version
        id: version
        uses: tiouoo/tiller/version@v2
        with:
          version: ${{ inputs.version }}

      - name: Create and push version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Authenticate to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Pack NuGet packages
        shell: bash
        run: bash .github/scripts/pack-nuget.sh

      - name: Publish packages to NuGet.org
        uses: tiouoo/tiller/nuget@v2
        with:
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          packages: artifacts/*.nupkg

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" artifacts/*.nupkg --title "OvoUi $VERSION" --generate-notes
