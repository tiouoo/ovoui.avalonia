name: publish/nuget

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  publish:
    uses: tiouoo/tiller/.github/workflows/nuget.yml@v1
    with:
      version: ${{ inputs.version }}
      dotnet-version: 10.x
      pack-script: .github/scripts/pack-nuget.sh
      release-name-prefix: OvoUi
    secrets: inherit
